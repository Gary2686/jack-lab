      <p>Jack Lab 是一支跨領域的研究團隊，研究主軸包含：</p>
      <ul>
        <li>人工智慧與數位轉型（AI &amp; Digital Transformation）</li>

        <li>電子商務與數位服務（E-Commerce &amp; Digital Services）</li>
        <li>團隊與專案管理（Team &amp; Project Management）</li>
        <li>哈佛商業評論教學個案（Harvard Teaching Cases）</li>
        <li>模糊集質性比較分析（fuzzy-set Qualitative Comparative Analysis, fsQCA）</li>
      </ul>
      <p>主要成員包含：徐士傑（Jack Hsu，教授兼系主任）、鄭鈞（Jacob Cheng，博士後研究員）、葉欲禾（Gary Yeh Yu-Ho，博士候選人），以及碩士生與校友若干。</p>
