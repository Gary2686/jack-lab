<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />

  <!-- Tailwind (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: "#272555",
            brand: {
              50: "#eef5fc", 100: "#d8e8f7", 200: "#b6d2ef", 300: "#88b4e3",
              400: "#5a93d4", 500: "#3b76c0", 600: "#2f5ea3", 700: "#284e84",
              800: "#243f68", 900: "#1f3556",
            },
            sand: "#e9dac4",
          },
          fontFamily: {
            sans: ['Inter', '"Noto Sans TC"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- 更新檔案後可調整 ?v 數字以強制瀏覽器抓最新版 / bump ?v to bust cache after edits -->
  <link rel="stylesheet" href="css/styles.css?v=9" />
</head>
